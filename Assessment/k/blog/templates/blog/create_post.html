{% extends 'blog/base.html' %}

{% block title %}Create Post - WriteSphere{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="glass-container">
            <h2 class="mb-4">Create New Post</h2>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                
                {% for field in form %}
                <div class="mb-3">
                    <label class="form-label text-white-50">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                    <div class="text-danger small">{{ field.errors }}</div>
                    {% endif %}
                </div>
                {% endfor %}

                <div class="d-flex justify-content-end mt-4">
                    <a href="{% url 'blog:home' %}" class="btn btn-outline-secondary me-2">Cancel</a>
                    <button type="submit" class="btn btn-primary px-4">Publish Story</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
