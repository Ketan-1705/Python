{% extends 'blog/base.html' %}

{% block title %}Delete Post - WriteSphere{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <div class="glass-container border-danger p-5">
            <h2 class="mb-4 text-danger">Are you sure?</h2>
            <p class="text-white-50 mb-5">You are about to delete "<strong>{{ post.title }}</strong>". <br>This action cannot be undone.</p>
            
            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-center">
                    <a href="{% url 'blog:post_detail' post.slug %}" class="btn btn-outline-secondary me-3 px-4">Cancel</a>
                    <button type="submit" class="btn btn-danger px-4">Confirm Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
